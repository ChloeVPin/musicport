[package]
name = "musicport-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "musicport core: iPhone media library + device access via libimobiledevice"

[lib]
name = "musicport_core"

[dependencies]
anyhow = "1"
libc = "0.2"
lofty = "0.22"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
